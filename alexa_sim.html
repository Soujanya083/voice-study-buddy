<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy - Simulated Alexa+</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
:root{--bg:#0b1220;--card:#121c31;--line:#22314f;--text:#e8eefc;--mute:#8fa3c7;--accent:#2dd4ff;--me:#1d4ed8;--ok:#34d399;--bad:#f87171}
@media (prefers-color-scheme: light){:root{--bg:#f3f6fc;--card:#fff;--line:#d9e2f2;--text:#0f1b33;--mute:#51648a;--accent:#0891b2;--me:#2563eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
header h1{font-size:18px;margin:0}header small{color:var(--mute)}
.ring{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.ring.live{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.5);opacity:.5}}
main{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding:16px;max-width:1100px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
#chat{height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.b{max-width:85%;padding:9px 12px;border-radius:14px;white-space:pre-wrap}
.b.a{background:var(--line);align-self:flex-start}.b.u{background:var(--me);color:#fff;align-self:flex-end}
.row{display:flex;gap:8px;margin-top:10px}
input,textarea{flex:1;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
button{background:var(--accent);color:#04202a;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ok)}
#log{font:12px ui-monospace,Consolas,monospace;color:var(--mute);max-height:150px;overflow:auto}
#log b{color:var(--accent)}details{margin-top:12px}summary{cursor:pointer;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header><div class="ring" id="ring"></div><div><h1>Study Buddy <small>simulated Alexa+ experience</small></h1><small>Talks to the MCP server at <code>/mcp</code> over Streamable HTTP</small></div></header>
<main>
<section class="card">
  <h2>Conversation</h2>
  <div id="chat"></div>
  <div class="row">
    <button id="mic" title="Speak (Chrome)">🎤 Speak</button>
    <input id="msg" placeholder='Try: "quiz me on dbms", "how am I doing", "stop"' autocomplete="off">
    <button id="send">Send</button>
  </div>
  <div class="chips" id="topicChips"></div>
  <div class="chips">
    <button class="alt" data-s="quiz me">Quiz me</button>
    <button class="alt" data-s="how am I doing">How am I doing?</button>
    <button class="alt" data-s="weak topics">Weak topics</button>
    <button class="alt" data-s="plan my revision">📅 Plan</button>
    <button class="alt" data-s="hint">Hint</button>
    <button class="alt" data-s="explain">Explain</button>
    <button class="alt" data-s="help">Help</button>
    <button class="alt" id="muteBtn">🔊 Voice on</button>
  </div>
</section>
<aside style="display:flex;flex-direction:column;gap:16px">
  <section class="card"><h2>Progress</h2><div id="streak" style="font-weight:600"></div><div id="exam" style="font-weight:600;margin-top:4px"></div><div id="chart"></div><div id="stats">Loading…</div><div id="topics"></div></section>
  <section class="card"><h2>Exam planner</h2>
    <div class="stack" style="margin-top:0"><label style="color:var(--mute);font-size:13px">Exam date</label>
      <input type="date" id="examDate"><button id="planBtn">Plan my revision</button></div></section>
  <section class="card"><h2>Add study material</h2>
    <details open><summary>Add one flashcard</summary><div class="stack">
      <input id="ct" placeholder="Topic (e.g. DBMS)"><input id="cq" placeholder="Question"><input id="ca" placeholder="Answer"><button id="addCard">Add flashcard</button></div></details>
    <details><summary>Generate with Gemini (notes optional)</summary><div class="stack">
      <input type="file" id="file" accept=".txt,.md,.pdf,text/plain,application/pdf">
      <input id="nt" placeholder="Topic"><textarea id="nn" rows="4" placeholder="Paste your notes (optional). Leave empty and Gemini uses just the topic."></textarea><button id="gen">Generate flashcards</button></div></details>
  </section>
  <section class="card"><h2>MCP tool calls</h2><div id="log"></div></section>
</aside>
</main>
<script>
const $=id=>document.getElementById(id);
let rid=1, awaiting=null, lastCard=null, voiceOn=true, topic="";

async function rpc(method, params){
  const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:rid++,method,params})});
  const j=await r.json(); if(j.error) throw new Error(j.error.message); return j.result;
}
async function tool(name,args={}){
  const l=document.createElement('div'); l.innerHTML='<b>'+name+'</b>('+JSON.stringify(args).slice(0,80)+')'; $('log').prepend(l);
  const res=await rpc('tools/call',{name,arguments:args});
  const t=res.content&&res.content[0]?res.content[0].text:'{}';
  let out; try{out=JSON.parse(t)}catch(e){out={speech:t}}
  const note=document.createElement('span');
  if(out.graded_by){note.textContent=' → graded by '+out.graded_by+(out.gemini_error?' (Gemini error: '+out.gemini_error.slice(0,70)+')':'')}
  else if(out.error){note.textContent=' → error: '+out.error}
  else{note.textContent=' → ok'}
  l.append(note);
  return out;
}
function say(text,who='a',speak=true){
  const b=document.createElement('div'); b.className='b '+who; b.textContent=text; $('chat').append(b); $('chat').scrollTop=1e9;
  if(who==='a'&&speak&&voiceOn&&'speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';
    $('ring').classList.add('live');u.onend=()=>$('ring').classList.remove('live');speechSynthesis.speak(u);}
}
async function refresh(){
  try{
    const s=await tool('study_summary'), w=await tool('weak_topics'), tp=await tool('list_topics');
    $('stats').innerHTML=['Total cards|'+s.total_cards,'Due now|'+s.due_now,'Mastered|'+s.mastered,'Accuracy|'+(s.accuracy_pct==null?'-':s.accuracy_pct+'%')]
      .map(x=>{const[a,b]=x.split('|');return '<div class="stat"><span>'+a+'</span><b>'+b+'</b></div>'}).join('');
    $('exam').textContent=(s.exam_in_days!=null&&s.exam_in_days>=0)?'📅 Exam in '+s.exam_in_days+' day'+(s.exam_in_days==1?'':'s'):'';
    $('streak').textContent=s.streak>0?'🔥 '+s.streak+'-day streak':'Answer a question today to start a streak';
    const mx=Math.max(1,...s.last7.map(d=>d.answered));
    $('chart').innerHTML='<div style="display:flex;gap:6px;align-items:flex-end;height:70px;margin:10px 0 2px">'+s.last7.map(d=>'<div title="'+d.date+': '+d.correct+'/'+d.answered+' correct" style="flex:1;border-radius:4px;background:var(--accent);opacity:'+(d.answered?1:.25)+';height:'+Math.max(4,Math.round(64*d.answered/mx))+'px"></div>').join('')+'</div><small style="color:var(--mute)">Questions answered, last 7 days</small>';
    $('topicChips').innerHTML='';
    (tp.topics||[]).forEach(t=>{const b=document.createElement('button');b.className='alt';b.textContent='📚 '+t.topic+' ('+t.due+' due)';b.onclick=()=>handle('quiz me on '+t.topic);$('topicChips').append(b)});
    $('topics').innerHTML=(w.topics||[]).map(t=>'<div style="margin-top:8px">'+t.topic+' <small style="color:var(--mute)">'+(t.accuracy_pct==null?'not attempted':t.accuracy_pct+'%')+'</small><div class="bar"><i style="width:'+(t.accuracy_pct||0)+'%"></i></div></div>').join('');
  }catch(e){$('stats').textContent='Server not reachable. Is python server.py running?'}
}
async function plan(args){
  const r=await tool('plan_revision',args); say(r.speech);
  if(r.schedule&&r.schedule.length){say('Your plan:\n'+r.schedule.map(x=>x.label+': '+x.reviews+' reviews, focus on '+x.focus).join('\n'),'a',false)}
  refresh();
}
async function ask(){
  const q=await tool('get_question',{topic});
  awaiting=q.card_id||null; return q.speech;
}
async function handle(text){
  const t=text.trim(); if(!t) return; say(t,'u'); const low=t.toLowerCase();
  try{
    if(/^(stop|quit|exit|cancel|that's all|enough)/.test(low)){awaiting=null;say('Okay, stopping the quiz. Great work!');return}
    // Commands that always work, even while a question is waiting for an answer.
    const em=low.match(/exam.*\bin (\d+) days?/);
    if(em){await plan({days_left:parseInt(em[1])});return}
    if(/^(plan|study plan|plan my revision|revision plan)/.test(low)){await plan({});return}
    if(/^(how am i|my progress|progress|summary|study summary)/.test(low)){const s=await tool('study_summary');const w=await tool('weak_topics');say(s.speech+' '+w.speech);return}
    if(/^(weak topics|weak)/.test(low)){say((await tool('weak_topics')).speech);return}
    if(/^(help|what can you do)/.test(low)){say('You can say: quiz me, quiz me on DBMS, how am I doing, weak topics, or my exam is in 5 days. During a quiz say hint, skip, or stop. After an answer, say explain.');return}
    if(/^(quiz|test|ask)\s+me/.test(low)){const m=low.match(/(?:on|about)\s+(.+)/);topic=m?m[1].trim():"";say(await ask());return}
    if(/^hint/.test(low)){
      if(awaiting){say((await tool('get_hint',{card_id:awaiting})).speech)}else{say('Ask me a question first, then say hint.')}return}
    if(/^explain/.test(low)){
      if(lastCard){say((await tool('explain_answer',{card_id:lastCard})).speech)}else{say('Answer a question first, then say explain.')}return}
    if(awaiting){
      if(/^(skip|next)$/.test(low)){say(await ask());return}
      const r=await tool('check_answer',{card_id:awaiting,user_answer:t}); lastCard=awaiting; awaiting=null;
      const nxt=await ask(); say(r.speech+'. Next question. '+nxt); await refresh(); return}
    const m=low.match(/(quiz|test|ask)\s+me(?:\s+(?:on|about)\s+(.+))?/);
    if(m||/^(start|begin|next)/.test(low)){topic=(m&&m[2])?m[2].trim():"";say(await ask());return}
    say("Sorry, I didn't catch that. Try: quiz me, or how am I doing.");
  }catch(e){say('Something went wrong: '+e.message)}
}
$('planBtn').onclick=()=>{const d=$('examDate').value;plan(d?{exam_date:d}:{})};
$('send').onclick=()=>{handle($('msg').value);$('msg').value=''};
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'){$('send').click()}});
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>handle(b.dataset.s));
$('muteBtn').onclick=()=>{voiceOn=!voiceOn;$('muteBtn').textContent=voiceOn?'🔊 Voice on':'🔇 Voice off';if(!voiceOn)speechSynthesis.cancel()};
$('addCard').onclick=async()=>{const r=await tool('add_flashcard',{topic:$('ct').value||'general',question:$('cq').value,answer:$('ca').value});say(r.speech);$('cq').value=$('ca').value='';refresh()};
$('gen').onclick=async()=>{if(!$('nt').value.trim()&&!$('nn').value.trim()){say('Type a topic, or paste some notes first.');return}say('Generating flashcards…');const r=await tool('generate_flashcards',{topic:$('nt').value||'general',notes:$('nn').value,count:5});say(r.error?r.speech+' ('+r.error+')':r.speech);refresh()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const title=f.name.replace(/\.[^.]+$/,''); if(!$('nt').value)$('nt').value=title;
  if(f.name.toLowerCase().endsWith('.pdf')){
    say('Reading '+f.name+'…');
    try{const r=await fetch('/api/extract',{method:'POST',body:f});const j=await r.json();
      if(!r.ok){say(j.error||'Could not read that PDF.');return}
      $('nn').value=j.text;say('Loaded '+j.chars+' characters from the PDF'+(j.truncated?' (using the first part)':'')+'. Now click Generate flashcards.')
    }catch(err){say('Could not read that PDF: '+err.message)}
  }else{const r=new FileReader();r.onload=()=>{$('nn').value=String(r.result).slice(0,6000)};r.readAsText(f)}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang='en-IN';rec.onresult=e=>handle(e.results[0][0].transcript);rec.onend=()=>$('mic').textContent='🎤 Speak';
  $('mic').onclick=()=>{speechSynthesis.cancel();$('mic').textContent='Listening…';rec.start()}}
else{$('mic').disabled=true;$('mic').title='Use Chrome for voice input'}
say("Hi! I'm Study Buddy. Add some flashcards on the right, then say: quiz me.");refresh();
</script>
</body>
</html>
